name: Patch ForgeFit adaptive plan

on:
  push:
    paths:
      - '.github/workflows/patch-adaptive-plan.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply adaptive workout patch
        run: python3 tools/patch_adaptive_plan.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/xgamerstore/forgefit/MainActivity.kt
          git commit -m 'Rotate and adapt weekly workout plans'
          git push origin main
