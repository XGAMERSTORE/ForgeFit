name: Add system back navigation

on:
  push:
    paths:
      - '.github/workflows/add-system-back.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add Android system back gesture handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/xgamerstore/forgefit/MainActivity.kt')
          s = p.read_text()
          pairs = []
          pairs.append(("import androidx.activity.compose.setContent\n", "import androidx.activity.compose.setContent\nimport androidx.activity.compose.BackHandler\n"))
          pairs.append(("fun Onboarding(start:UserProfile, finish:(UserProfile)->Unit) {\n    var step by remember { mutableIntStateOf(0) }\n    var u by remember { mutableStateOf(start) }\n    Column(Modifier.fillMaxSize().background(Bg).padding(20.dp)) {", "fun Onboarding(start:UserProfile, finish:(UserProfile)->Unit) {\n    var step by remember { mutableIntStateOf(0) }\n    var u by remember { mutableStateOf(start) }\n    BackHandler(enabled = step > 0) { step-- }\n    Column(Modifier.fillMaxSize().background(Bg).padding(20.dp)) {"))
          pairs.append(("fun MainArea(profile:UserProfile,store:FitStore,save:(UserProfile)->Unit) {\n    var tab by remember { mutableIntStateOf(0) }\n    var training by remember { mutableStateOf(false) }\n    var extra by remember { mutableStateOf<String?>(null) }\n    if(training) { WorkoutScreen(profile,store){training=false}; return }\n    when(extra) {", "fun MainArea(profile:UserProfile,store:FitStore,save:(UserProfile)->Unit) {\n    var tab by remember { mutableIntStateOf(0) }\n    var training by remember { mutableStateOf(false) }\n    var extra by remember { mutableStateOf<String?>(null) }\n\n    BackHandler(enabled = training || extra != null || tab != 0) {\n        when {\n            training -> training = false\n            extra == \"premium\" -> extra = \"settings\"\n            extra != null -> extra = null\n            tab != 0 -> tab = 0\n        }\n    }\n\n    if(training) { WorkoutScreen(profile,store){training=false}; return }\n    when(extra) {"))
          pairs.append(("fun Library() {\n    var localSelected by remember { mutableStateOf<Exercise?>(null) }\n    var remoteSelected by remember { mutableStateOf<RemoteExercise?>(null) }\n    if(localSelected!=null) { Detail(localSelected!!){localSelected=null};return }\n    if(remoteSelected!=null) { RemoteDetail(remoteSelected!!){remoteSelected=null};return }", "fun Library() {\n    var localSelected by remember { mutableStateOf<Exercise?>(null) }\n    var remoteSelected by remember { mutableStateOf<RemoteExercise?>(null) }\n\n    BackHandler(enabled = localSelected != null || remoteSelected != null) {\n        localSelected = null\n        remoteSelected = null\n    }\n\n    if(localSelected!=null) { Detail(localSelected!!){localSelected=null};return }\n    if(remoteSelected!=null) { RemoteDetail(remoteSelected!!){remoteSelected=null};return }"))
          for old, new in pairs:
              if old not in s:
                  raise SystemExit('Expected source block not found: ' + old[:70])
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/xgamerstore/forgefit/MainActivity.kt
          git commit -m 'Support Android system back gesture throughout app'
          git push origin main
