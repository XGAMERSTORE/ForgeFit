name: Apply ForgeFit visual polish

on:
  push:
    paths:
      - 'tools/apply_visual_polish.py'
      - '.github/workflows/apply-visual-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply dark UI polish
        run: python tools/apply_visual_polish.py
      - name: Commit polished sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/xgamerstore/forgefit/MainActivity.kt app/src/main/java/com/xgamerstore/forgefit/ExercisePresentation.kt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Polish ForgeFit dark UI and fix contrast"
            git push
          fi
