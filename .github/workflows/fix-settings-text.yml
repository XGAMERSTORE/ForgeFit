name: Fix settings text

on:
  push:
    paths:
      - '.github/workflows/fix-settings-text.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Force readable settings colors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/xgamerstore/forgefit/MainActivity.kt')
          s = p.read_text()
          replacements = {
              'IconButton(back){Icon(Icons.Default.ArrowBack,null)};Text("Nastavení",fontSize=28.sp,fontWeight=FontWeight.Black)': 'IconButton(back){Icon(Icons.Default.ArrowBack,null,tint=Color.White)};Text("Nastavení",fontSize=28.sp,fontWeight=FontWeight.Black,color=Color.White)',
              'Text("ForgeFit Premium",Modifier.weight(1f),fontWeight=FontWeight.Bold);Icon(Icons.Default.ChevronRight,null)': 'Text("ForgeFit Premium",Modifier.weight(1f),fontWeight=FontWeight.Bold,color=Color.White);Icon(Icons.Default.ChevronRight,null,tint=Color.White)',
              'Column(Modifier.weight(1f)){Text(title,fontWeight=FontWeight.Bold);Text(sub,color=Muted,fontSize=12.sp)}\n        Switch(checked=value,onCheckedChange=set)': 'Column(Modifier.weight(1f)){Text(title,fontWeight=FontWeight.Bold,color=Color.White);Text(sub,color=Muted,fontSize=12.sp)}\n        Switch(checked=value,onCheckedChange=set)',
              'Column(Modifier.weight(1f)){Text(title,fontWeight=FontWeight.Bold);Text(sub,color=Muted,fontSize=12.sp)}\n        Icon(Icons.Default.ChevronRight,null,tint=Muted)': 'Column(Modifier.weight(1f)){Text(title,fontWeight=FontWeight.Bold,color=Color.White);Text(sub,color=Muted,fontSize=12.sp)}\n        Icon(Icons.Default.ChevronRight,null,tint=Muted)'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected block: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/xgamerstore/forgefit/MainActivity.kt
          git commit -m 'Force readable text in Settings'
          git push origin main
