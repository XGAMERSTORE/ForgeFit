name: Patch ForgeFit i18n

on:
  push:
    paths:
      - .github/workflows/patch-i18n.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wire language system into app
        shell: bash
        run: |
          FILE=app/src/main/java/com/xgamerstore/forgefit/MainActivity.kt
          grep -q 'super.onCreate(savedInstanceState)' "$FILE"
          grep -q 'SettingInfo("Jazyk","Čeština")' "$FILE"
          sed -i '/super.onCreate(savedInstanceState)/a\        ForgeLang.init(this)' "$FILE"
          sed -i 's/SettingInfo("Jazyk","Čeština")/LanguageSettingRow()/' "$FILE"
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/xgamerstore/forgefit/MainActivity.kt
          git commit -m 'Wire 59-language selector and runtime translation'
          git push origin main
