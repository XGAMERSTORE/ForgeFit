name: Patch ForgeFit circuit workout

on:
  push:
    paths:
      - '.github/workflows/patch-circuit-workout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply workout patch
        run: python3 tools/patch_circuit_workout.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/xgamerstore/forgefit/MainActivity.kt
          git commit -m 'Use circuit rounds and cap weekly goal display'
          git push origin main
