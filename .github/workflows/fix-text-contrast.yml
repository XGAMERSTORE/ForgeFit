name: Fix text contrast

on:
  push:
    paths:
      - '.github/workflows/fix-text-contrast.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix Compose dark theme text colors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/xgamerstore/forgefit/MainActivity.kt')
          s = p.read_text()
          old = 'MaterialTheme(colorScheme=darkColorScheme(primary=Orange,secondary=Gold,background=Bg,surface=Panel)) {'
          new = 'MaterialTheme(colorScheme=darkColorScheme(primary=Orange,onPrimary=Color.Black,secondary=Gold,onSecondary=Color.Black,background=Bg,onBackground=Color(0xFFF4F1F7),surface=Panel,onSurface=Color(0xFFF4F1F7),surfaceVariant=Panel2,onSurfaceVariant=Muted)) {'
          if old not in s:
              raise SystemExit('Theme line not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/xgamerstore/forgefit/MainActivity.kt
          git commit -m 'Fix dark theme text contrast'
          git push origin main
