name: Apply Czech stable UI

on:
  push:
    paths:
      - 'tools/apply_czech_stable_ui.py'
      - '.github/workflows/apply-czech-stable-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python tools/apply_czech_stable_ui.py
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/xgamerstore/forgefit/MainActivity.kt app/src/main/java/com/xgamerstore/forgefit/ExercisePresentation.kt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Localize workout UI and stabilize rest layout"
            git push
          fi
